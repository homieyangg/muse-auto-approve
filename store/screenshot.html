<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; width: 1280px; height: 800px; }
    body { display: flex; align-items: center; justify-content: center; gap: 88px; background: linear-gradient(135deg, #eef3ff, #f8fafc); font-family: -apple-system, "PingFang TC", sans-serif; color: #1f2937; }
    .intro { width: 520px; }
    .intro img { width: 96px; height: 96px; margin: 0 0 -12px -12px; }
    .intro h1 { font-size: 40px; line-height: 1.3; margin: 24px 0 16px; }
    .intro p { font-size: 20px; line-height: 1.7; color: #4b5563; margin: 0 0 12px; }
    .popup { width: 340px; background: #fff; border-radius: 14px; box-shadow: 0 20px 50px rgba(15, 23, 42, .18); padding: 20px; font-size: 15px; }
    .popup h2 { font-size: 17px; margin: 0 0 14px; }
    .popup label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .popup input { width: 16px; height: 16px; accent-color: #0866ff; }
    .count { margin: 14px 0 8px; color: #555; }
    .count b { color: #0866ff; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { padding: 9px 0; border-top: 1px solid #eee; font-size: 13px; line-height: 1.5; }
    time { color: #888; margin-right: 6px; }
  </style>
</head>
<body>
  <div class="intro">
    <img src="../icons/icon128.png" alt="">
    <h1>審批卡跳出來，<br>自動幫你按允許</h1>
    <p>助理存取新網站時不用守著畫面，排程任務不會卡住。</p>
    <p>有「一律允許」時優先按，其他聊天室來的審批也會處理。</p>
  </div>
  <div class="popup">
    <h2>Auto Approve for Muse</h2>
    <label><input type="checkbox" checked> 自動允許</label>
    <label><input type="checkbox" checked> 優先按「一律允許」</label>
    <div class="count">已自動允許 <b>12</b> 次</div>
    <ul>
      <li><time>09:42:18</time>[一次] 允許存取 news.example.com？</li>
      <li><time>09:15:03</time>[一律] 允許存取 docs.example.org？</li>
      <li><time>08:30:47</time>[一次] 允許存取 shop.example.net？</li>
    </ul>
  </div>
</body>
</html>
